name: Convert and Upload Ben-Yehuda Dataset

on:
  # הפעלה אוטומטית כאשר משתנה קוד העיבוד, המקור או קבצי Parquet קיימים
  push:
    branches:
      - main
      - alonim
    paths:
      - 'project-ben-yehuda/create_dataset.py'
      - 'project-ben-yehuda/pby_dataset/**'
      - 'project-ben-yehuda/source_data/**'
      - 'project-ben-yehuda/output_parquet/**'
      - 'scripts/upload_directory_to_hf.py'
      - 'requirements.txt'
      - '.github/workflows/upload_pby_dataset.yml'
  
  # הפעלה ידנית דרך ממשק ה-Actions ב-GitHub
  workflow_dispatch:
    inputs:
      pby_release:
        description: "Project Ben-Yehuda release tag to process, or latest"
        required: false
        default: "latest"
      use_local_source:
        description: "Use checked-in project-ben-yehuda/source_data instead of downloading release assets"
        required: false
        default: "false"

env:
  # הגדרת שם ריפו הדאטהסט שלך ב-Hugging Face
  HF_PBY_DATASET_REPO_ID: "nhlocal/project-ben-yehuda"
  
  # נתיבים ספציפיים לפרויקט בן יהודה
  PBY_SOURCE_REPO: "projectbenyehuda/public_domain_dump"
  PBY_SOURCE_DIR: "project-ben-yehuda/source_data"
  PARQUET_OUTPUT_DIR: "project-ben-yehuda/output_parquet"
  PBY_TEXT_ARCHIVE: "txt.zip"
  PBY_CATALOG_ASSET: "pseudocatalogue.csv"

jobs:
  build-and-upload-pby:
    runs-on: ubuntu-latest
    steps:
      # שלב 1: שכפול הריפו
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      # שלב 2: הגדרת סביבת פייתון
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # שלב 3: התקנת הספריות הנדרשות
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve Project Ben-Yehuda release
        id: release
        if: ${{ (inputs.use_local_source || 'false') != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ inputs.pby_release || 'latest' }}
        run: |
          if [ "$REQUESTED_RELEASE" = "latest" ]; then
            TAG_NAME="$(gh release view --repo "$PBY_SOURCE_REPO" --json tagName --jq .tagName)"
          else
            TAG_NAME="$REQUESTED_RELEASE"
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Using Project Ben-Yehuda release: $TAG_NAME"

      - name: Download Project Ben-Yehuda release assets
        if: ${{ (inputs.use_local_source || 'false') != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$PBY_SOURCE_DIR"
          mkdir -p "$PBY_SOURCE_DIR"
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "$PBY_SOURCE_REPO" \
            --pattern "$PBY_TEXT_ARCHIVE" \
            --pattern "$PBY_CATALOG_ASSET" \
            --dir "$PBY_SOURCE_DIR" \
            --clobber
          unzip -q "$PBY_SOURCE_DIR/$PBY_TEXT_ARCHIVE" -d "$PBY_SOURCE_DIR"

      # שלב 4: הכנת Parquet להעלאה.
      # ברירת המחדל בונה מה-assets של GitHub Release; בהרצה ידנית ניתן לבחור מקור מקומי.
      - name: Build Parquet dataset
        run: |
          if [ ! -f "$PBY_SOURCE_DIR/$PBY_CATALOG_ASSET" ]; then
            echo "No existing Parquet files or source catalog found. Cannot build dataset."
            exit 1
          fi
          PBY_TEXT_SOURCE_DIR="$PBY_SOURCE_DIR"
          if [ -d "$PBY_SOURCE_DIR/txt" ]; then
            PBY_TEXT_SOURCE_DIR="$PBY_SOURCE_DIR/txt"
          fi
          echo "Building Parquet directly from Project Ben-Yehuda source files..."
          python project-ben-yehuda/create_dataset.py \
            --source-dir "$PBY_TEXT_SOURCE_DIR" \
            --catalog-file "$PBY_SOURCE_DIR/$PBY_CATALOG_ASSET" \
            --parquet-output-dir "$PARQUET_OUTPUT_DIR" \
            --parquet-output-file "pby_dataset.parquet" \
            --parquet-shards 10
          echo "Parquet build complete."

      # שלב 5: הרצת סקריפט ההעלאה עם תיקיית ה-Parquet
      - name: Run upload script
        env:
          # העברת הטוקן הסודי של Hugging Face (שהוגדר כבר בריפו)
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          echo "Uploading directory '${{ env.PARQUET_OUTPUT_DIR }}' to Hugging Face..."
          python scripts/upload_directory_to_hf.py \
            --repo-id ${{ env.HF_PBY_DATASET_REPO_ID }} \
            --local-dir ${{ env.PARQUET_OUTPUT_DIR }} \
            --delete-pattern "data/*.parquet" \
            --commit-message "Update Project Ben-Yehuda dataset"
