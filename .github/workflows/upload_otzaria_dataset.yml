name: Convert and Upload Otzaria Dataset

on:
  push:
    branches:
      - main
      - alonim
    paths:
      - 'otzaria-library/**'
      - 'scripts/upload_directory_to_hf.py'
      - 'requirements.txt'
      - '.github/workflows/upload_otzaria_dataset.yml'
  schedule:
    - cron: '17 2 * * 1,4'
  workflow_dispatch:
    inputs:
      otzaria_release:
        description: "Otzaria release tag to process, or latest"
        required: false
        default: "latest"
      force_rebuild:
        description: "Rebuild even if the latest release was already uploaded"
        required: false
        default: "false"
      parquet_target_file_size_mb:
        description: "Approximate Parquet shard size in MB"
        required: false
        default: "128"

permissions:
  actions: write
  contents: read

concurrency:
  group: upload-otzaria-dataset
  cancel-in-progress: false

env:
  HF_OTZARIA_DATASET_REPO_ID: "NHLOCAL/judaic-texts-corpus"
  OTZARIA_SOURCE_REPO: "Otzaria/otzaria-library"
  OTZARIA_SOURCE_DIR: "otzaria-library/source_data"
  OTZARIA_PARQUET_OUTPUT_DIR: "otzaria-library/output_parquet"
  OTZARIA_RELEASE_ASSET: "otzaria_latest.zip"
  OTZARIA_DICTA_RELEASE_ASSET: "otzaria_dicta_latest.zip"
  OTZARIA_LEGACY_RELEASE: "library-141"
  OTZARIA_LEGACY_ARCHIVE: "otzaria_library_141.zip"

jobs:
  build-and-upload-otzaria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve Otzaria release and check upload state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ inputs.otzaria_release || 'latest' }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
          LAST_PROCESSED_RELEASE: ${{ vars.LAST_OTZARIA_RELEASE }}
        run: |
          if [ "$REQUESTED_RELEASE" = "latest" ]; then
            TAG_NAME="$(gh release view --repo "$OTZARIA_SOURCE_REPO" --json tagName --jq .tagName)"
          else
            TAG_NAME="$REQUESTED_RELEASE"
          fi

          SHOULD_RUN="true"
          UPDATE_STATE="true"
          if [ "$REQUESTED_RELEASE" != "latest" ]; then
            UPDATE_STATE="false"
            echo "Explicit Otzaria release requested; state variable will not be updated."
          elif [ "$FORCE_REBUILD" = "true" ]; then
            echo "Force rebuild requested for latest Otzaria release."
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$LAST_PROCESSED_RELEASE" ] && [ "$TAG_NAME" = "$LAST_PROCESSED_RELEASE" ]; then
              SHOULD_RUN="false"
              UPDATE_STATE="false"
              echo "Otzaria release $TAG_NAME was already uploaded. Skipping rebuild."
            fi
          fi

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "update_state=$UPDATE_STATE" >> "$GITHUB_OUTPUT"
          echo "Using Otzaria release: $TAG_NAME"

      - name: Download Otzaria release archive
        if: ${{ steps.release.outputs.should_run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OTZARIA_SOURCE_DIR"
          for ASSET in "$OTZARIA_RELEASE_ASSET" "$OTZARIA_DICTA_RELEASE_ASSET"; do
            gh release download "${{ steps.release.outputs.tag }}" \
              --repo "$OTZARIA_SOURCE_REPO" \
              --pattern "$ASSET" \
              --dir "$OTZARIA_SOURCE_DIR" \
              --clobber
          done
          gh release download "$OTZARIA_LEGACY_RELEASE" \
            --repo "$OTZARIA_SOURCE_REPO" \
            --pattern "$OTZARIA_RELEASE_ASSET" \
            --output "$OTZARIA_SOURCE_DIR/$OTZARIA_LEGACY_ARCHIVE" \
            --clobber

      - name: Extract release metadata files
        if: ${{ steps.release.outputs.should_run == 'true' }}
        run: |
          unzip -p "$OTZARIA_SOURCE_DIR/$OTZARIA_RELEASE_ASSET" files_manifest.json > "$OTZARIA_SOURCE_DIR/files_manifest.json"
          unzip -p "$OTZARIA_SOURCE_DIR/$OTZARIA_RELEASE_ASSET" metadata.json > "$OTZARIA_SOURCE_DIR/metadata.json"

      - name: Build Parquet dataset
        if: ${{ steps.release.outputs.should_run == 'true' }}
        env:
          TARGET_FILE_SIZE_MB: ${{ inputs.parquet_target_file_size_mb || '128' }}
        run: |
          python otzaria-library/create_dataset.py \
            --archive-path "$OTZARIA_SOURCE_DIR/$OTZARIA_RELEASE_ASSET" \
            --extra-archive-path "$OTZARIA_SOURCE_DIR/$OTZARIA_DICTA_RELEASE_ASSET" \
            --archive-spec "$OTZARIA_SOURCE_DIR/$OTZARIA_LEGACY_ARCHIVE::ExtraBooks" \
            --manifest-path "$OTZARIA_SOURCE_DIR/files_manifest.json" \
            --metadata-path "$OTZARIA_SOURCE_DIR/metadata.json" \
            --parquet-output-dir "$OTZARIA_PARQUET_OUTPUT_DIR" \
            --parquet-output-file "judaic_texts.parquet" \
            --parquet-target-file-size-mb "$TARGET_FILE_SIZE_MB" \
            --github-release "${{ steps.release.outputs.tag }}" \
            --batch-size 512

      - name: Upload Parquet files to Hugging Face
        if: ${{ steps.release.outputs.should_run == 'true' }}
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          python scripts/upload_directory_to_hf.py \
            --repo-id "$HF_OTZARIA_DATASET_REPO_ID" \
            --local-dir "$OTZARIA_PARQUET_OUTPUT_DIR" \
            --path-in-repo "data" \
            --delete-pattern "data/*.parquet" \
            --commit-message "Update Otzaria dataset from ${{ steps.release.outputs.tag }}"

      - name: Remember uploaded Otzaria release
        if: ${{ steps.release.outputs.should_run == 'true' && steps.release.outputs.update_state == 'true' }}
        env:
          ACTIONS_VARIABLES_TOKEN: ${{ secrets.ACTIONS_VARIABLES_TOKEN }}
        run: |
          if [ -z "$ACTIONS_VARIABLES_TOKEN" ]; then
            echo "Skipping repository variable update because ACTIONS_VARIABLES_TOKEN is not configured."
            exit 0
          fi

          export GH_TOKEN="$ACTIONS_VARIABLES_TOKEN"
          gh variable set LAST_OTZARIA_RELEASE --body "${{ steps.release.outputs.tag }}"
